<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="190" viewBox="0 0 1080 190" role="img" aria-labelledby="title desc">
  <title id="title">vigil follow-up loop</title>
  <desc id="desc">An agent schedules a durable follow-up loop; vigil waits, checks, retries or closes, then records history and sends notifications.</desc>
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .label { font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect class="box" x="20" y="50" width="135" height="90" />
  <text class="label" x="87" y="84" text-anchor="middle">Agent task</text>
  <text class="small" x="87" y="110" text-anchor="middle">cannot verify yet</text>

  <path class="arrow" d="M160 95 H205" />

  <rect class="box" x="210" y="50" width="145" height="90" />
  <text class="label" x="282" y="84" text-anchor="middle">Schedule loop</text>
  <text class="small" x="282" y="110" text-anchor="middle">task + check</text>

  <path class="arrow" d="M360 95 H405" />

  <rect class="box" x="410" y="50" width="155" height="90" />
  <text class="label" x="487" y="84" text-anchor="middle">Internal wait</text>
  <text class="small" x="487" y="110" text-anchor="middle">no cron/gateway</text>

  <path class="arrow" d="M570 95 H615" />

  <rect class="box" x="620" y="50" width="130" height="90" />
  <text class="label" x="685" y="84" text-anchor="middle">Run check</text>
  <text class="small" x="685" y="110" text-anchor="middle">shell/file/http/grep</text>

  <path class="arrow" d="M755 95 H800" />

  <rect class="box" x="805" y="50" width="120" height="90" />
  <text class="label" x="865" y="84" text-anchor="middle">Decide</text>
  <text class="small" x="865" y="110" text-anchor="middle">success/retry/fail</text>

  <path class="arrow" d="M930 95 H975" />

  <rect class="box" x="980" y="50" width="80" height="90" />
  <text class="label" x="1020" y="84" text-anchor="middle">Notify</text>
  <text class="small" x="1020" y="110" text-anchor="middle">history</text>
</svg>
